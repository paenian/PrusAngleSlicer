# Print profiles for Phrozen SLA printers (3rd-party, via UVtools output conversion).

[vendor]
repo_id = non-prusa-sla
# Vendor name will be shown by the Config Wizard.
name = Phrozen SLA
# Configuration version of this file.
config_version = 1.0.0
# Where to get the updates from (unused for a purely bundled profile).
config_update_url = https://files.prusa3d.com/wp-content/uploads/repository/PrusaSlicer-settings-master/live/PhrozenSLA/

# The printer models will be shown by the Configuration Wizard in this order.

[printer_model:SONIC MEGA 8K S]
name = Phrozen Sonic Mega 8K S
variants = default
technology = SLA
family = SONIC
default_materials = Anycubic ABS-Like Grey Resin @PHROZEN 0.05

[printer_model:SONIC MINI 8K]
name = Phrozen Sonic Mini 8K
variants = default
technology = SLA
family = SONIC
default_materials = Anycubic ABS-Like Grey Resin @PHROZEN 0.05

## SLA print profiles

[sla_print:*common print PHROZEN SLA*]
compatible_printers_condition = printer_notes=~/.*VENDOR_PHROZEN.*/ and printer_notes=~/.*SLA.*/
layer_height = 0.05
pad_edge_radius = 0.5
pad_enable = 1
pad_max_merge_distance = 50
pad_wall_height = 0
pad_wall_thickness = 1
pad_wall_slope = 45
faded_layers = 8
slice_closing_radius = 0.005
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_density_at_45 = 250
support_density_at_horizontal = 500
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_max_bridge_length = 10
support_minimal_z = 0
support_object_elevation = 5
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
supports_enable = 1
support_small_pillar_diameter_percent = 60%

[sla_print:0.05 Normal @PHROZEN]
inherits = *common print PHROZEN SLA*
layer_height = 0.05

## SLA materials

[sla_material:*common PHROZEN SLA*]
compatible_printers_condition = printer_notes=~/.*VENDOR_PHROZEN.*/ and printer_notes=~/.*SLA.*/
compatible_prints_condition = layer_height == 0.05
exposure_time = 3
initial_exposure_time = 30
initial_layer_height = 0.05
material_correction = 1,1,1
area_fill = 45
material_notes = #Distances are defined in mm, speeds are defined in mm/s.\n#Delay is defined in s.\nLIFT_DISTANCE=8.0\nLIFT_SPEED=2.5\nRETRACT_SPEED=3.0\nBOTTOM_LIFT_SPEED=2.0\nBOTTOM_LIFT_DISTANCE=9.0\nDELAY_BEFORE_EXPOSURE=0.5\nANTIALIASING=1

[sla_material:Anycubic ABS-Like Grey Resin @PHROZEN 0.05]
inherits = *common PHROZEN SLA*
exposure_time = 2.5
initial_exposure_time = 30
material_type = Tough
material_vendor = Anycubic
material_colour = #808080
compatible_printers_condition = printer_notes=~/.*VENDOR_PHROZEN.*/ and printer_notes=~/.*SLA.*/
material_notes = Anycubic ABS-Like resin (grey). Distances in mm, speeds in mm/s.\nLIFT_DISTANCE=8.0\nLIFT_SPEED=2.5\nRETRACT_SPEED=3.0\nDELAY_BEFORE_EXPOSURE=0.5\nANTIALIASING=1

## Printers

[printer:Phrozen Sonic Mega 8K S]
printer_technology = SLA
printer_model = SONIC MEGA 8K S
printer_variant = default
default_sla_material_profile = Anycubic ABS-Like Grey Resin @PHROZEN 0.05
default_sla_print_profile = 0.05 Normal @PHROZEN
thumbnails = 224x168
sla_archive_format = uvtools:ChituboxFile@4
bed_shape = 0x0,330x0,330x185,0x185
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 7680
display_pixels_y = 4320
display_width = 330
display_height = 185
max_print_height = 300
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and material profiles to link them to this printer profile.\nPRINTER_VENDOR_PHROZEN\nPRINTER_MODEL_SONICMEGA8KS\nPRINTER_TECHNOLOGY_SLA\n

[printer:Phrozen Sonic Mini 8K]
printer_technology = SLA
printer_model = SONIC MINI 8K
printer_variant = default
default_sla_material_profile = Anycubic ABS-Like Grey Resin @PHROZEN 0.05
default_sla_print_profile = 0.05 Normal @PHROZEN
thumbnails = 224x168
sla_archive_format = uvtools:ChituboxFile@4
bed_shape = 0x0,68.04x0,68.04x120.96,0x120.96
display_orientation = portrait
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 7500
display_pixels_y = 3240
display_width = 68.04
display_height = 120.96
max_print_height = 180
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and material profiles to link them to this printer profile.\nPRINTER_VENDOR_PHROZEN\nPRINTER_MODEL_SONICMINI8K\nPRINTER_TECHNOLOGY_SLA\n
