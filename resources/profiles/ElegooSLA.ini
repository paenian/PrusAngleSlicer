# Print profiles for Elegoo SLA printers (3rd-party, via UVtools output conversion).

[vendor]
repo_id = non-prusa-sla
name = Elegoo SLA
config_version = 1.0.0
config_update_url = https://files.prusa3d.com/wp-content/uploads/repository/PrusaSlicer-settings-master/live/ElegooSLA/

[printer_model:SATURN 4 ULTRA]
name = Elegoo Saturn 4 Ultra
variants = default
technology = SLA
family = SATURN
default_materials = Anycubic ABS-Like Grey Resin @ELEGOO 0.05

[printer_model:MARS 4]
name = Elegoo Mars 4
variants = default
technology = SLA
family = MARS
default_materials = Anycubic ABS-Like Grey Resin @ELEGOO 0.05

## SLA print profiles

[sla_print:*common print ELEGOO SLA*]
compatible_printers_condition = printer_notes=~/.*VENDOR_ELEGOO.*/ and printer_notes=~/.*SLA.*/
layer_height = 0.05
pad_edge_radius = 0.5
pad_enable = 1
pad_max_merge_distance = 50
pad_wall_height = 0
pad_wall_thickness = 1
pad_wall_slope = 45
faded_layers = 8
slice_closing_radius = 0.005
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_density_at_45 = 250
support_density_at_horizontal = 500
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_max_bridge_length = 10
support_minimal_z = 0
support_object_elevation = 5
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
supports_enable = 1
support_small_pillar_diameter_percent = 60%

[sla_print:0.05 Normal @ELEGOO]
inherits = *common print ELEGOO SLA*
layer_height = 0.05

## SLA materials

[sla_material:*common ELEGOO SLA*]
compatible_printers_condition = printer_notes=~/.*VENDOR_ELEGOO.*/ and printer_notes=~/.*SLA.*/
compatible_prints_condition = layer_height == 0.05
exposure_time = 3
initial_exposure_time = 30
initial_layer_height = 0.05
material_correction = 1,1,1
area_fill = 45
material_notes = #Distances are defined in mm, speeds are defined in mm/s.\n#Delay is defined in s.\nLIFT_DISTANCE=8.0\nLIFT_SPEED=2.5\nRETRACT_SPEED=3.0\nDELAY_BEFORE_EXPOSURE=0.5\nANTIALIASING=1

[sla_material:Anycubic ABS-Like Grey Resin @ELEGOO 0.05]
inherits = *common ELEGOO SLA*
exposure_time = 2.5
initial_exposure_time = 30
material_type = Tough
material_vendor = Anycubic
material_colour = #808080
compatible_printers_condition = printer_notes=~/.*VENDOR_ELEGOO.*/ and printer_notes=~/.*SLA.*/

## Printers

[printer:Elegoo Saturn 4 Ultra]
printer_technology = SLA
printer_model = SATURN 4 ULTRA
printer_variant = default
default_sla_material_profile = Anycubic ABS-Like Grey Resin @ELEGOO 0.05
default_sla_print_profile = 0.05 Normal @ELEGOO
thumbnails = 224x168
sla_archive_format = uvtools:GooFile
bed_shape = 0x0,153.36x0,153.36x77.76,0x77.76
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 11520
display_pixels_y = 5120
display_width = 153.36
display_height = 77.76
max_print_height = 220
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords!\nPRINTER_VENDOR_ELEGOO\nPRINTER_MODEL_SATURN4ULTRA\nPRINTER_TECHNOLOGY_SLA\n

[printer:Elegoo Mars 4]
printer_technology = SLA
printer_model = MARS 4
printer_variant = default
default_sla_material_profile = Anycubic ABS-Like Grey Resin @ELEGOO 0.05
default_sla_print_profile = 0.05 Normal @ELEGOO
thumbnails = 224x168
sla_archive_format = uvtools:GooFile
bed_shape = 0x0,153.36x0,153.36x77.76,0x77.76
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 8520
display_pixels_y = 4320
display_width = 153.36
display_height = 77.76
max_print_height = 175
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords!\nPRINTER_VENDOR_ELEGOO\nPRINTER_MODEL_MARS4\nPRINTER_TECHNOLOGY_SLA\n
