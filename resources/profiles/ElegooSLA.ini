
[vendor]
repo_id = non-prusa-sla
# Vendor name will be shown by the Config Wizard.
name = Elegoo SLA (3rd party)
config_version = 0.1.0
config_update_url =

# 3rd-party SLA printers routed through UVtools for output-format conversion.
# sla_archive_format = uvtools:<EncoderName>[@version] (see UVTools integration).

[printer_model:SATURN 4 ULTRA]
name = Elegoo Saturn 4 Ultra
variants = default
technology = SLA
family = SATURN

[printer_model:MARS 4]
name = Elegoo Mars 4
variants = default
technology = SLA
family = MARS

## SLA printers

[printer:Elegoo Saturn 4 Ultra]
printer_technology = SLA
printer_model = SATURN 4 ULTRA
printer_variant = default
thumbnails = 224x168
sla_archive_format = uvtools:GooFile
bed_shape = 0x0,153.36x0,153.36x77.76,0x77.76
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 11520
display_pixels_y = 5120
display_width = 153.36
display_height = 77.76
max_print_height = 220
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords! PRINTER_VENDOR_ELEGOO\nPRINTER_MODEL_SATURN4ULTRA\nPRINTER_TECHNOLOGY_SLA\n

[printer:Elegoo Mars 4]
printer_technology = SLA
printer_model = MARS 4
printer_variant = default
thumbnails = 224x168
sla_archive_format = uvtools:GooFile
bed_shape = 0x0,153.36x0,153.36x77.76,0x77.76
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0
display_pixels_x = 8520
display_pixels_y = 4320
display_width = 153.36
display_height = 77.76
max_print_height = 175
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 0.5
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
printer_notes = Don't remove the following keywords! PRINTER_VENDOR_ELEGOO\nPRINTER_MODEL_MARS4\nPRINTER_TECHNOLOGY_SLA\n
