# Builds the macOS (Apple Silicon) and Windows (x64) apps for this branch and, for a
# release tag, publishes them as a GitHub Release.
#
#   Release:  push a tag   prusangleslicer-v<version>   (e.g. prusangleslicer-v2.9.7-1)
#   Test run: Actions tab > "Release builds" > Run workflow  (artifacts only, no release)
#
# Branch-specific settings are in `env` below. The SLA-3rd-party branch carries the
# same file with its own values.
name: Release builds

on:
  push:
    tags: ['prusangleslicer-v*']
  workflow_dispatch:

env:
  APP_NAME: PrusAngleSlicer
  TAG_PREFIX: prusangleslicer-v
  # Blocking tests for this branch's feature. The full suite runs too, informational.
  FEATURE_TESTS: '[AngledSlicing]'
  MACOSX_DEPLOYMENT_TARGET: '12.0'
  # Prebuilt dependencies are kept as assets of this (pre)release. Unlike the Actions
  # cache, release assets are visible to every run, including tag-triggered ones and
  # both feature branches (they share the same dependency sources).
  DEPS_RELEASE: ci-deps
  GH_REPO: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.l.outputs.label }}
    steps:
      - id: l
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/${TAG_PREFIX}* ]]; then
            label="${GITHUB_REF#refs/tags/${TAG_PREFIX}}"
          else
            label="test-${GITHUB_SHA::7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Release label: $label"

  macos:
    needs: label
    runs-on: macos-15            # Apple Silicon (arm64)
    timeout-minutes: 350
    permissions:
      contents: write          # store prebuilt dependencies on the ci-deps release
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install automake autoconf libtool texinfo gettext m4 || true

      - name: Get prebuilt dependencies
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="deps-macos-arm64-${MACOSX_DEPLOYMENT_TARGET}-${{ hashFiles('deps/**', 'cmake/modules/AddCMakeProject.cmake') }}.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          mkdir -p deps/build
          if gh release download "$DEPS_RELEASE" --pattern "$name" --dir . ; then
            tar -xzf "$name" -C deps/build && rm "$name"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prebuilt dependencies yet; they will be built."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dependencies (slow, first run only)
        if: steps.deps.outputs.hit != 'true'
        run: |
          cd deps/build
          cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j"$(sysctl -n hw.ncpu)"

      # Stored right away so later failures do not throw away hours of work.
      - name: Store prebuilt dependencies
        if: steps.deps.outputs.hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.deps.outputs.name }}
        run: |
          tar -czf "$NAME" -C deps/build destdir
          ls -l "$NAME"
          gh release view "$DEPS_RELEASE" >/dev/null 2>&1 || gh release create "$DEPS_RELEASE" --prerelease \
            --title "CI build cache - not an app download" \
            --notes "Prebuilt build dependencies used by the release workflow. There is nothing here for users: download the apps from the other releases." || true
          gh release upload "$DEPS_RELEASE" "$NAME" --clobber

      - name: Build app and tests
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="$PWD/deps/build/destdir/usr/local" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DSLIC3R_BUILD_LABEL="${{ needs.label.outputs.label }}"
          cmake --build build --target PrusaSlicer libslic3r_tests -j"$(sysctl -n hw.ncpu)"

      - name: Feature tests (blocking)
        run: build/tests/libslic3r/libslic3r_tests "$FEATURE_TESTS"

      - name: Full test suite (informational)
        continue-on-error: true
        run: build/tests/libslic3r/libslic3r_tests "~[arc_welder]"

      - name: Package
        run: packaging/macos/package.sh build dist "${{ needs.label.outputs.label }}"

      - name: Smoke test the packaged app
        run: |
          python3 - <<'PY'
          import struct
          s=10.0; v=[(-s,-s,0),(s,-s,0),(s,s,0),(-s,s,0),(-s,-s,20),(s,-s,20),(s,s,20),(-s,s,20)]
          t=[(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(2,3,7),(2,7,6),(1,2,6),(1,6,5),(0,4,7),(0,7,3)]
          open('cube.stl','wb').write(b'\0'*80+struct.pack('<I',len(t))+b''.join(struct.pack('<fff',0,0,0)+b''.join(struct.pack('<fff',*v[i]) for i in x)+struct.pack('<H',0) for x in t))
          PY
          "dist/$APP_NAME.app/Contents/MacOS/PrusaSlicer" --export-gcode cube.stl --output cube.gcode
          head -1 cube.gcode

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: label
    runs-on: windows-2022
    timeout-minutes: 350
    permissions:
      contents: write          # store prebuilt dependencies on the ci-deps release
    env:
      DEPS_DIR: D:\deps-out
    steps:
      - uses: actions/checkout@v4

      - name: Get prebuilt dependencies
        id: deps
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "deps-windows-x64-${{ hashFiles('deps/**', 'cmake/modules/AddCMakeProject.cmake') }}.tar.gz"
          "name=$name" >> $env:GITHUB_OUTPUT
          gh release download $env:DEPS_RELEASE --pattern $name --dir .
          if ($LASTEXITCODE -eq 0) {
            tar -xzf $name -C D:\
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item $name
            "hit=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host 'No prebuilt dependencies yet; they will be built.'
            "hit=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Build dependencies (slow, first run only)
        if: steps.deps.outputs.hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps\build | Out-Null
          cd deps\build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DDESTDIR="$env:DEPS_DIR" -DDEP_DEBUG=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build . --config Release -- /m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Stored right away so later failures do not throw away hours of work.
      - name: Store prebuilt dependencies
        if: steps.deps.outputs.hit != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.deps.outputs.name }}
        run: |
          tar -czf $env:NAME -C D:\ deps-out
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item $env:NAME | Select-Object Name, Length | Out-String | Write-Host
          gh release view $env:DEPS_RELEASE *> $null
          if ($LASTEXITCODE) {
            gh release create $env:DEPS_RELEASE --prerelease --title "CI build cache - not an app download" --notes "Prebuilt build dependencies used by the release workflow. There is nothing here for users: download the apps from the other releases."
          }
          gh release upload $env:DEPS_RELEASE $env:NAME --clobber
          exit $LASTEXITCODE

      - name: Build app and tests
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:DEPS_DIR\usr\local" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DSLIC3R_BUILD_LABEL="${{ needs.label.outputs.label }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release -- /m
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Feature tests (blocking)
        shell: pwsh
        run: |
          & build\tests\libslic3r\Release\libslic3r_tests.exe "$env:FEATURE_TESTS"
          exit $LASTEXITCODE

      - name: Full test suite (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          & build\tests\libslic3r\Release\libslic3r_tests.exe "~[arc_welder]"
          exit $LASTEXITCODE

      - name: Package
        shell: pwsh
        run: packaging\windows\package.ps1 -BuildDir build -OutDir dist -Label "${{ needs.label.outputs.label }}"

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          python -c "import struct;s=10.0;v=[(-s,-s,0),(s,-s,0),(s,s,0),(-s,s,0),(-s,-s,20),(s,-s,20),(s,s,20),(-s,s,20)];t=[(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(2,3,7),(2,7,6),(1,2,6),(1,6,5),(0,4,7),(0,7,3)];open('cube.stl','wb').write(b'\0'*80+struct.pack('<I',len(t))+b''.join(struct.pack('<fff',0,0,0)+b''.join(struct.pack('<fff',*v[i]) for i in x)+struct.pack('<H',0) for x in t))"
          & "dist\$env:APP_NAME\prusa-slicer-console.exe" --export-gcode cube.stl --output cube.gcode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content cube.gcode -TotalCount 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [label, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ needs.label.outputs.label }}
        run: |
          sed -e "s/{{APP}}/$APP_NAME/g" -e "s/{{LABEL}}/$LABEL/g" packaging/RELEASE_NOTES.md > notes.md
          [ -f packaging/FEATURE_NOTES.md ] && cat packaging/FEATURE_NOTES.md >> notes.md
          # Test / release-candidate tags are published as pre-releases.
          pre=""; case "$LABEL" in *test*|*rc*|*beta*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --title "$APP_NAME $LABEL" --notes-file notes.md
